[project]
name = "amazon-mcp"
version = "0.1.0"
description = "Amazon MCP server: search, compare, review, and buy products — cart, checkout, orders, and returns"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
camoufox = [
    "camoufox[geoip]>=0.4.0",
]

[project.scripts]
amazon-mcp = "amazon_mcp:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"
